name: Book parking

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Ignore weekend and 13:00 rules
        type: boolean
        default: false

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node index.js --run ${{ inputs.force && '--force' || '' }}
        env:
          PARKLY_URL: ${{ secrets.PARKLY_URL }}
          PARKLY_EMAIL: ${{ secrets.PARKLY_EMAIL }}
          PARKLY_PASSWORD: ${{ secrets.PARKLY_PASSWORD }}
